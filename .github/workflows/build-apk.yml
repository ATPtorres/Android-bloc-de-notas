name: Compilar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Crear APK instalable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 35 y herramientas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK de prueba
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Preparar APK descargable
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BlocNotas-Android-v1.0-debug.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BlocNotas-Android-APK
          path: dist/BlocNotas-Android-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
